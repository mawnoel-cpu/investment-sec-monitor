name: FT Game Kalshi Monitor

on:
  workflow_dispatch:
  pull_request:
    paths: ['ft_kalshi_*.py', 'tests/test_kalshi*.py', '.github/workflows/kalshi_pipeline.yml']
  push:
    branches: [main]
    paths: ['ft_kalshi_*.py', 'tests/test_kalshi*.py', '.github/workflows/kalshi_pipeline.yml']
  schedule:
    # 10:50 Toronto, allowing for observed 2-4h GitHub scheduling delays.
    # Same single daily collector. On-time data remain <4h old at the 14:45 review.
    - cron: '50 14 * 10 1-5'
    - cron: '50 15 1-27 11 1-5'

permissions:
  contents: read

concurrency:
  group: ft-game-kalshi-writer
  cancel-in-progress: false

jobs:
  collect-kalshi:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline regression tests
        run: python tests/run_offline.py
      - name: Collect public markets and verify dedicated FT sheet writes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python ft_kalshi_writer.py
