name: FT Game Price Close and Health Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ft_price_writer.py"
      - "tests/test_price_writer.py"
      - "ft_pipeline_health.py"
      - "ft_trade_desk.py"
      - "ft_stress_panel.py"
      - "tests/test_stress_panel.py"
      - "tests/test_trade_desk_views.py"
      - "tests/test_pipeline_health.py"
      - "ft_rotation_universe.py"
      - "ft_sector_rotation.py"
      - "ft_financial_stress.py"
      - "ft_decision_inputs.py"
      - "tests/test_decision_inputs.py"
      - "tests/test_financial_stress.py"
      - "ft_sheets_retry.py"
      - "tests/test_sector_rotation.py"
      - ".github/workflows/price_pipeline.yml"
  schedule:
    # Three price/archive checkpoints, not an intraday live-quote feed.
    # GOOGLEFINANCE in PRICE MONITOR supplies live quotes directly.
    # 08:10 verifies the latest completed session before the 14:20 decision.
    # 16:50 archives the new US close for 17:40 PostClose where available.
    # 19:05 retries any delayed closing bar; next morning is the backstop.
    # October 2026 (EDT).
    - cron: "10 12 * 10 1-5"   # 08:10 Toronto
    - cron: "50 20 * 10 1-5"   # 16:50 Toronto
    - cron: "05 23 * 10 1-5"   # 19:05 Toronto
    # November 1–27 2026 (EST); evening retry crosses into next UTC day.
    - cron: "10 13 1-27 11 1-5" # 08:10 Toronto
    - cron: "50 21 1-27 11 1-5" # 16:50 Toronto
    - cron: "05 00 2-28 11 2-6" # 19:05 Toronto

permissions:
  contents: read

concurrency:
  group: ft-game-price-writer
  cancel-in-progress: false

jobs:
  archive-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline data/session validation
        run: python tests/run_offline.py
      - name: Update verified FT prices, diagnosed coverage and decision-cell notes
        if: github.ref == 'refs/heads/main'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python ft_price_writer.py ${{ (github.event.schedule == '10 12 * 10 1-5' || github.event.schedule == '10 13 1-27 11 1-5') && 'pretrade' || 'close' }}

      - name: RULE-015 and RULE-020 immediate rotation review and saved proposals
        if: always() && github.ref == 'refs/heads/main'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python ft_sector_rotation.py --prepare-next-session

      - name: Verify durable research and review receipts
        if: always() && github.ref == 'refs/heads/main'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python ft_pipeline_health.py


