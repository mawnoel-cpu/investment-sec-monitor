name: SEC EDGAR Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ft_sec_pipeline.py"
      - ".github/workflows/sec_pipeline.yml"
  schedule:
    # Toronto is UTC-4 through 31 Oct 2026.
    - cron: "17 11,23 * 10 *"
    # Toronto is UTC-5 from 1 Nov 2026; game ends 27 Nov.
    - cron: "17 0,12 1-27 11 *"

permissions:
  contents: read

jobs:
  update-sec-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update FT Game SEC feed
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python ft_sec_pipeline.py
