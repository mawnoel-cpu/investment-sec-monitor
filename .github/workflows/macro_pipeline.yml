name: FT Game Macro Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ft_macro_pipeline.py"
      - "ft_macro_coordinator.py"
      - "feed_validation.py"
      - "tests/test_macro*.py"
      - "requirements.txt"
      - ".github/workflows/macro_pipeline.yml"
  schedule:
    # Toronto UTC-4 through 31 Oct 2026.
    - cron: "15 13 * 10 *"       # 09:15 Toronto, daily; direct official sources
    - cron: "20 21 * 10 5"       # 17:20 Toronto, Friday; refresh after CFTC
    # Toronto UTC-5 from 1 Nov 2026; game ends 27 Nov.
    - cron: "15 14 1-27 11 *"
    - cron: "20 22 * 11 5"

permissions:
  contents: read

concurrency:
  group: ft-game-macro-writer
  cancel-in-progress: false

jobs:
  update-macro-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test preservation, freshness and log readback
        run: python tests/run_offline.py
      - name: Update coordinated FT Game macro snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python ft_macro_coordinator.py
