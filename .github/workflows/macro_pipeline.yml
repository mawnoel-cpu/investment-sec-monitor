name: FT Game Macro Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ft_macro_pipeline.py"
      - "ft_macro_runner.py"
      - ".github/workflows/macro_pipeline.yml"
  schedule:
    # Toronto is UTC-4 through 31 Oct 2026: 07:27 and 19:27 local.
    - cron: "27 11,23 * 10 *"
    # Toronto is UTC-5 from 1 Nov 2026; the 00:27 UTC run is prior-day 19:27 local.
    - cron: "27 0,12 1-28 11 *"

permissions:
  contents: read

jobs:
  update-macro-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update FT Game macro feed
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python ft_macro_runner.py
