name: FT Game Macro Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ft_macro_pipeline.py"
      - "pilot_macro_relay.py"
      - ".github/workflows/macro_pipeline.yml"
  schedule:
    # Toronto is UTC-4 through 31 Oct 2026.
    - cron: "27 11,23 * 10 *"
    # Toronto is UTC-5 from 1 Nov 2026; game ends 27 Nov.
    - cron: "27 0,12 1-27 11 *"

permissions:
  contents: read

jobs:
  update-macro-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update FT Game macro feed
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python pilot_macro_relay.py
